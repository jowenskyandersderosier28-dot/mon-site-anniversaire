<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #ff4d8d;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    #countdown {
      font-size: 5rem;
      font-weight: bold;
    }
    #content {
      display: none;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    .card {
      background: #1a1a1a;
      border: 2px solid #ff4d8d;
      border-radius: 15px;
      padding: 20px;
      max-width: 300px;
      box-shadow: 0 0 15px rgba(255, 77, 141, 0.4);
    }
    .heart {
      font-size: 3rem;
      color: #ff4d8d;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="countdown">3</div>

  <div id="content">
    <h1>HAPPY BIRTHDAY! ❤️</h1>
    <div class="card">
      <div class="heart">💖</div>
      <p>Bòn Fèt! Mwen swete w yon anpil bonè, lanmou ak siksè nan lavi w.</p>
    </div>
  </div>

  <script>
    let count = 3;
    const countElement = document.getElementById('countdown');
    const contentElement = document.getElementById('content');

    const timer = setInterval(() => {
      count--;
      if (count > 0) {
        countElement.textContent = count;
      } else {
        clearInterval(timer);
        countElement.style.display = 'none';
        contentElement.style.display = 'block';
      }
    }, 1000);
  </script>
</body>
</html>
