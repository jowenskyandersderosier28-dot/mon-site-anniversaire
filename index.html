<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Harlie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05050a;
            color: #ff3385;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- EFE MATRIX WOZ AP DESANN --- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- TÈKS KONTÈ NWAYO AK DIFERAN EKRI --- */
        .matrix-text-container {
            position: absolute;
            z-index: 2;
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff3385;
            text-shadow: 0 0 20px #ff1a75, 0 0 40px #ff1a75;
            animation: pulseText 0.8s ease-in-out infinite alternate;
            text-align: center;
            letter-spacing: 2px;
        }
        @keyframes pulseText {
            0% { transform: scale(1); opacity: 0.85; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        /* --- EKRAN FÒM KÈ FINAL --- */
        .heart-gallery-screen {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background: #05050a;
            z-index: 5;
            justify-content: center;
            align-items: center;
        }
        .heart-gallery-screen.active {
            display: flex;
        }

        .heart-shape-container {
            position: relative;
            width: 320px;
            height: 320px;
        }
        .heart-item {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 51, 133, 0.2);
            border: 2px solid #ff3385;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(255, 51, 133, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            animation: fadeInPhoto 0.4s ease forwards;
        }
        @keyframes fadeInPhoto {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Canvas Matrix Woz -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Tèks ki ap defile yo -->
    <div class="matrix-text-container" id="mainText">3</div>

    <!-- Ekran Fòm Kè nan fen an -->
    <div class="heart-gallery-screen" id="heartGallery">
        <div class="heart-shape-container" id="heartContainer"></div>
    </div>

    <script>
        // --- 1. MATRIX Woz ANIME ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789HARLIE💖✨";
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff3385';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);


        // --- 2. SEKANS TÈKS INTRO ---
        const sequence = ["3", "2", "1", "HAPPY", "BIRTHDAY", "TO", "HARLIE"];
        let seqIndex = 0;
        const textElement = document.getElementById('mainText');

        const textInterval = setInterval(() => {
            seqIndex++;
            if (seqIndex < sequence.length) {
                textElement.innerText = sequence[seqIndex];
            } else {
                clearInterval(textInterval);
                textElement.style.display = 'none';
                showHeartGallery(); 
            }
        }, 1400);


        // --- 3. FÒM KÈ A ---
        function showHeartGallery() {
            const galleryScreen = document.getElementById('heartGallery');
            const container = document.getElementById('heartContainer');
            galleryScreen.classList.add('active');

            const points = [
                {x: 160, y: 60}, {x: 130, y: 40}, {x: 100, y: 50}, {x: 80, y: 70},
                {x: 75, y: 100}, {x: 85, y: 130}, {x: 110, y: 160}, {x: 135, y: 190},
                {x: 160, y: 220}, {x: 185, y: 190}, {x: 210, y: 160}, {x: 235, y: 130},
                {x: 245, y: 100}, {x: 240, y: 70}, {x: 220, y: 50}, {x: 190, y: 40},
                {x: 160, y: 90}, {x: 145, y: 70}, {x: 175, y: 70}, {x: 120, y: 90},
                {x: 200, y: 90}, {x: 130, y: 120}, {x: 190, y: 120}, {x: 160, y: 150}
            ];

            points.forEach((pt, index) => {
                setTimeout(() => {
                    const item = document.createElement('div');
                    item.className = 'heart-item';
                    item.style.left = pt.x + 'px';
                    item.style.top = pt.y + 'px';
                    item.innerText = "💖";
                    container.appendChild(item);
                }, index * 80);
            });
        }
    </script>
</body>
</html>
