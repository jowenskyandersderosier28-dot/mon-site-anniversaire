<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Harlie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }
        .screen.active {
            display: flex;
        }
        .cat-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: floatCat 3s ease-in-out infinite;
        }
        @keyframes floatCat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .card-container {
            position: relative;
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
        }
        .images-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .images-row img {
            width: 45%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: CHAT AK AKÈY -->
    <div id="screen-1" class="screen active">
        <!-- Asire w ou mete imaj chat la sou GitHub ak menm non sa a, oswa chanje non an isit la -->
        <img src="cat.gif" alt="Chat k ap jwe gitè" class="cat-img">
        <h1>Anivèsè Siksè!</h1>
    </div>

    <!-- SCREEN 2: SLIDESHOW FOTO AK MESAJ -->
    <div id="screen-2" class="screen">
        <div class="card-container" id="card-content">
            <!-- Kontni an ap soti otomatikman nan JavaScript -->
        </div>
    </div>

    <script>
        // --- 3. CARD SLIDESHOW AK MESAJ OU YO ---
        const slides = [
            {
                msg: "Happy Birthday mon nounours👩🏽‍❤️‍👨🏾💖",
                img1: "WhatsApp Image 2026-09-22 at 5.01.23 PM (1).jpeg",
                img2: "WhatsApp Image 2026-09-22 at 5.01.23 PM (2).jpeg"
            },
            {
                msg: "Chaque jour, j'essaie de te montrer à quel point tu es spéciale à mes yeux. Et aujourd'hui encore plus, je veux que tu te sentes unique, chouchoutée, aimée, valorisée, comblée. ✨",
                img1: "WhatsApp Image 2026-09-22 at 5.01.24 PM.jpeg",
                img2: "WhatsApp Image 2026-09-22 at 5.01.24 PM (1).jpeg"
            },
            {
                msg: "Toi qui as fait de mon cœur un musée qui déborde",
                img1: "WhatsApp Image 2026-09-22 at 5.01.25 PM.jpeg",
                img2: "WhatsApp Image 2026-09-22 at 5.01.26 PM.jpeg"
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            const cardContent = document.getElementById('card-content');
            if (!cardContent) return;
            
            const slide = slides[currentSlide];
            cardContent.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 10px;">${slide.msg}</p>
                <div class="images-row">
                    <img src="${slide.img1}" alt="Foto Harlie">
                    <img src="${slide.img2}" alt="Foto Harlie">
                </div>
            `;
        }

        // Fonksyonalite pou chanje ekran oubyen slide otomatikman si sa nesesè
        document.addEventListener("DOMContentLoaded", () => {
            renderSlide();
            
            // Pa egzanp, apre 5 segonn l ap pase sou ekran dezyèm nan si l pa t ankò aktif
            setTimeout(() => {
                document.getElementById('screen-1').classList.remove('active');
                document.getElementById('screen-2').classList.add('active');
            }, 4000);
        });
    </script>
</body>
</html>
