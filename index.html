<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Harlie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- TI KÈ WOZ AK ZETWAL NAN BACKGROUND NAN --- */
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .heart {
            position: absolute;
            color: #ff4d79;
            font-size: 20px;
            animation: fall linear infinite;
            opacity: 0.7;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            z-index: 2;
        }
        .screen.active {
            display: flex;
        }

        /* --- TI CHAT LA --- */
        .cat-img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin-bottom: 15px;
            animation: floatCat 3s ease-in-out infinite;
        }
        @keyframes floatCat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* --- LIV LA AK FOTO YO --- */
        .card-container {
            position: relative;
            background: #fff;
            color: #333;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 121, 0.3);
            width: 100%;
            animation: popIn 0.5s ease-in-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .images-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .images-row img {
            width: 45%;
            height: 240px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff4d79, #ff758c);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 77, 121, 0.4);
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- BACKGROUND AK TI KÈ WOZ YO -->
    <div class="hearts-container" id="hearts"></div>

    <!-- SCREEN 1: CHAT KI AP JWE GITÈ A AK AKÈY -->
    <div id="screen-1" class="screen active">
        <img src="happy3.gif" alt="Chat k ap jwe gitè" class="cat-img">
        <h1 style="color: #ff4d79; margin-bottom: 10px; font-size: 2rem;">Happy Birthday Harlie! 💖</h1>
        <p style="color: #ddd; margin-bottom: 15px;">M gen yon bèl sipriz pou ou...</p>
        <button class="btn" onclick="nextScreen()">Louvri Liv la ✨</button>
    </div>

    <!-- SCREEN 2: LIV LA AK FOTO YO -->
    <div id="screen-2" class="screen">
        <div class="card-container" id="card-content">
            <!-- Kontni an ap soti otomatikman nan JavaScript -->
        </div>
        <button class="btn" onclick="nextSlide()">Paj Suivan ➔</button>
    </div>

    <script>
        // --- TI KÈ WOZ YO ---
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '💖';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                heartsContainer.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 400);
        }
        createHearts();

        // --- LIST SLIDES AK MESAJ AK FOTO YO ---
        const slides = [
            {
                msg: "Happy Birthday mon nounours👩🏽‍❤️‍👨🏾💖",
                img1: "photos/1000088907.jpg",
                img2: "photos/1000088908.jpg"
            },
            {
                msg: "Chaque jour, j'essaie de te montrer à quel point tu es spéciale à mes yeux. ✨",
                img1: "photos/1000088909.jpg",
                img2: "photos/1000088910.jpg"
            },
            {
                msg: "Toi qui as fait de mon cœur un musée qui déborde de bonheur.",
                img1: "photos/1000088911.jpg",
                img2: "photos/1000088914.jpg"
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            const cardContent = document.getElementById('card-content');
            if (!cardContent) return;
            
            const slide = slides[currentSlide];
            cardContent.innerHTML = `
                <p style="font-size: 1.2rem; margin-bottom: 12px; font-weight: bold; color: #ff4d79;">${slide.msg}</p>
                <div class="images-row">
                    <img src="${slide.img1}" alt="Foto Harlie">
                    <img src="${slide.img2}" alt="Foto Harlie">
                </div>
            `;
        }

        function nextScreen() {
            document.getElementById('screen-1').classList.remove('active');
            document.getElementById('screen-2').classList.add('active');
            renderSlide();
        }

        function nextSlide() {
            currentSlide++;
            if (currentSlide < slides.length) {
                renderSlide();
            } else {
                currentSlide = 0; // Tounen nan premye paj la
                renderSlide();
            }
        }
    </script>
</body>
</html>
