<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Harlie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05050a;
            color: #ff3385;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- KÒD WOZ KI AP DESANN (MATRIX EFFECT) --- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- TÈKS KONTÈ NWAYO (3, 2, 1, HAPPY, BIRTHDAY, TO, HARLIE) --- */
        .matrix-text-container {
            position: absolute;
            z-index: 2;
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff3385;
            text-shadow: 0 0 20px #ff1a75, 0 0 40px #ff1a75;
            animation: pulseText 0.8s ease-in-out infinite alternate;
            text-align: center;
            letter-spacing: 2px;
        }
        @keyframes pulseText {
            0% { transform: scale(1); opacity: 0.85; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        /* --- KONTÈNÈ PANN POU LIV LA AK FOTO YO --- */
        .book-screen {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.92);
            z-index: 5;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .book-screen.active {
            display: flex;
        }

        .card-container {
            position: relative;
            background: #fff;
            color: #333;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 51, 133, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: popIn 0.5s ease-in-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .images-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .images-row img {
            width: 45%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff3385, #ff758c);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 51, 133, 0.4);
            transition: transform 0.2s;
            font-family: 'Arial', sans-serif;
        }
        .btn:hover {
            transform: scale(1.05);
        }

        /* --- FÒM KÈ AK FOTO NAN FEN AN --- */
        .heart-gallery-screen {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background: #05050a;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .heart-gallery-screen.active {
            display: flex;
        }
        .heart-shape-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        .heart-photo {
            position: absolute;
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #ff3385;
            box-shadow: 0 0 10px rgba(255, 51, 133, 0.6);
            animation: fadeInPhoto 0.4s ease forwards;
        }
        @keyframes fadeInPhoto {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Canvas Matrix Woz -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Tèks Intro (3, 2, 1, HAPPY, BIRTHDAY, TO, HARLIE) -->
    <div class="matrix-text-container" id="mainText">3</div>

    <!-- Ekran Liv la (Paj pa paj ak foto w yo) -->
    <div class="book-screen" id="bookScreen">
        <div class="card-container" id="cardContent">
            <!-- Kontni paj la ap parèt la a -->
        </div>
        <button class="btn" onclick="nextSlide()">Paj Suivan ➔</button>
    </div>

    <!-- Ekran Fòm Kè final ak foto yo -->
    <div class="heart-gallery-screen" id="heartGallery">
        <h2 style="color: #ff3385; margin-bottom: 20px; font-family: Arial, sans-serif;">Mwen tèlman renmen ou Harlie! 💖</h2>
        <div class="heart-shape-container" id="heartContainer"></div>
    </div>

    <script>
        // --- 1. MATRIX Woz ANIME ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789HARLIE💖✨";
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff3385';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);


        // --- 2. SEKANS TÈKS INTRO (3, 2, 1...) ---
        const sequence = ["3", "2", "1", "HAPPY", "BIRTHDAY", "TO", "HARLIE"];
        let seqIndex = 0;
        const textElement = document.getElementById('mainText');

        const textInterval = setInterval(() => {
            seqIndex++;
            if (seqIndex < sequence.length) {
                textElement.innerText = sequence[seqIndex];
            } else {
                clearInterval(textInterval);
                textElement.style.display = 'none';
                showBookScreen(); // Lè tèks yo fini, liv la ouvri!
            }
        }, 1400);


        // --- 3. LOGIK LIV LA AK FOTO W YO ---
        const slides = [
            {
                msg: "Happy Birthday mon nounours 👩🏽‍❤️‍👨🏾💖",
                img1: "WhatsApp Image 2026-09-22 at 5.01.17 PM (1).jpeg",
                img2: "WhatsApp Image 2026-09-22 at 5.01.25 PM.jpeg"
            },
            {
                msg: "Chaque jour, j'essaie de te montrer à quel point tu es spéciale à mes yeux. ✨",
                img1: "WhatsApp Image 2026-09-22 at 5.01.26 PM.jpeg",
                img2: "WhatsApp Image 2026-09-22 at 5.01.17 PM (1).jpeg"
            }
        ];

        let currentSlide = 0;

        function showBookScreen() {
            document.getElementById('bookScreen').classList.add('active');
            renderSlide();
        }

        function renderSlide() {
            const cardContent = document.getElementById('cardContent');
            const slide = slides[currentSlide];
            cardContent.innerHTML = `
                <p style="font-size: 1.15rem; margin-bottom: 12px; font-weight: bold; color: #ff3385; font-family: Arial, sans-serif;">${slide.msg}</p>
                <div class="images-row">
                    <img src="${slide.img1}" alt="Foto Harlie">
                    <img src="${slide.img2}" alt="Foto Harlie">
                </div>
            `;
        }

        function nextSlide() {
            currentSlide++;
            if (currentSlide < slides.length) {
                renderSlide();
            } else {
                // Lè tout paj liv yo fini, nou montre bèl fòm kè final la ak foto yo
                document.getElementById('bookScreen').classList.remove('active');
                showHeartGallery();
            }
        }


        // --- 4. FÒM KÈ FINAL AK FOTO YO ---
        function showHeartGallery() {
            const galleryScreen = document.getElementById('heartGallery');
            const container = document.getElementById('heartContainer');
            galleryScreen.classList.add('active');

            const points = [
                {x: 150, y: 50}, {x: 120, y: 30}, {x: 90, y: 40}, {x: 70, y: 60},
                {x: 65, y: 90}, {x: 75, y: 120}, {x: 100, y: 150}, {x: 125, y: 180},
                {x: 150, y: 210}, {x: 175, y: 180}, {x: 200, y: 150}, {x: 225, y: 120},
                {x: 235, y: 90}, {x: 230, y: 60}, {x: 210, y: 40}, {x: 180, y: 30},
                {x: 150, y: 80}, {x: 135, y: 60}, {x: 165, y: 60}, {x: 110, y: 80},
                {x: 190, y: 80}, {x: 120, y: 110}, {x: 180, y: 110}, {x: 150, y: 140}
            ];

            const userPhotos = [
                "WhatsApp Image 2026-09-22 at 5.01.17 PM (1).jpeg",
                "WhatsApp Image 2026-09-22 at 5.01.25 PM.jpeg",
                "WhatsApp Image 2026-09-22 at 5.01.26 PM.jpeg"
            ];

            points.forEach((pt, index) => {
                setTimeout(() => {
                    const img = document.createElement('img');
                    img.src = userPhotos[index % userPhotos.length];
                    img.className = 'heart-photo';
                    img.style.left = pt.x + 'px';
                    img.style.top = pt.y + 'px';
                    container.appendChild(img);
                }, index * 80);
            });
        }
    </script>
</body>
</html>
